name: Node.js CI & Publish to NPM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    name: Test & Validate Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt pytest httpx

      - name: Run Test Suite
        run: pytest tests/ -v

      - name: Synchronize Version
        run: node bin/sync-version.js

      - name: Test Package Build (npm pack)
        run: npm pack

  publish-npm:
    name: Publish to npmjs.com
    needs: test-and-package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Check Registry Version
        id: version-check
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          NPM_VER=$(npm view crewlyze version 2>/dev/null || echo "0.0.0")
          echo "Local version: $LOCAL_VER"
          echo "Published npm version: $NPM_VER"
          if [ "$LOCAL_VER" = "$NPM_VER" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Package version $LOCAL_VER is already published on npm."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Package version $LOCAL_VER needs to be published."
          fi

      - name: Publish to NPM
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
